# Runs on every push and pull request: loads the database, runs the 19
# database checks, lints every PHP file, then tests the PHP foundation and
# the running app over HTTP. A red cross on GitHub means something broke
# before it reaches the demo.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      MYSQL_PWD: root
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, gd, mbstring

      - name: Load schema and seed
        run: |
          # Same time zone as the campus and docker-compose.yml
          mysql -h127.0.0.1 -uroot -e "SET GLOBAL time_zone = '+08:00'"
          mysql -h127.0.0.1 -uroot < database/schema.sql
          mysql -h127.0.0.1 -uroot < database/seed.sql

      - name: Database checks
        run: bash scripts/verify_database.sh -h127.0.0.1 -uroot

      - name: PHP syntax check
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -r -n1 php -l

      - name: Reload fresh demo data
        run: |
          mysql -h127.0.0.1 -uroot < database/schema.sql
          mysql -h127.0.0.1 -uroot < database/seed.sql

      - name: PHP foundation tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
        run: php scripts/test_core.php

      - name: Auth and security tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
        run: php scripts/test_auth.php

      - name: Ticket signing tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
          TICKET_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
        run: php scripts/test_tickets.php

      - name: HTTP smoke test
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
          TICKET_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
        run: bash scripts/smoke_test.sh
